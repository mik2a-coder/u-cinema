# U CINEMÀ – site statique servi par nginx
server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;
    root /var/www/cinelux;
    index index.html;

    include /etc/nginx/snippets/cinelux-security.conf;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # La page et le service worker ne sont jamais mis en cache trop longtemps : les mises à jour arrivent vite
    location = /index.html { include /etc/nginx/snippets/cinelux-security.conf; add_header Cache-Control "no-cache"; }
    location = /sw.js      { include /etc/nginx/snippets/cinelux-security.conf; add_header Cache-Control "no-cache"; default_type application/javascript; }
    location = /manifest.webmanifest { include /etc/nginx/snippets/cinelux-security.conf; default_type application/manifest+json; add_header Cache-Control "no-cache"; }

    # Polices et icônes : cache long
    location /fonts/ { include /etc/nginx/snippets/cinelux-security.conf; expires 1y; add_header Cache-Control "public, immutable"; }
    location /icons/ { include /etc/nginx/snippets/cinelux-security.conf; expires 30d; }

    location /img/ { include /etc/nginx/snippets/cinelux-security.conf; expires 30d; }
    location / { include /etc/nginx/snippets/cinelux-security.conf; try_files $uri $uri/ /index.html; }
}
